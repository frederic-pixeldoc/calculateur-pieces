# Builds Netlify suspendus (crédit épuisé) : le site est servi gratuitement par GitHub Pages.
# Pour réactiver Netlify : supprimer le bloc [build] ci-dessous.
[build]
  ignore = "exit 0"

# Configuration Netlify
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Outil interne : ne pas indexer (en complément de la balise meta robots et de robots.txt)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
